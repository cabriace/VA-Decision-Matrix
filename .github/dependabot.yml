version: 2
updates:
  # ✅ Keep GitHub Actions workflows updated
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # 🚫 Skip npm updates for now (no Node environment)
  - package-ecosystem: "npm"
    directory: "/"
    ignore:
      - dependency-type: "all"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

